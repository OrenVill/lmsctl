name: publish-linux

# Runs whenever release-please publishes a GitHub Release (i.e. its release
# PR gets merged to master), building and attaching Linux binaries.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build and package
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for ARCH in amd64 arm64; do
            PKG_DIR="lmsctl-${VERSION}-linux-${ARCH}"
            mkdir -p "dist/$PKG_DIR"
            GOOS=linux GOARCH="$ARCH" go build -trimpath \
              -ldflags "-s -w -X lmsctl/cmd.version=${VERSION}" \
              -o "dist/$PKG_DIR/lmsctl" .
            cp README.md "dist/$PKG_DIR/"
            tar -C dist -czf "dist/${PKG_DIR}.tar.gz" "$PKG_DIR"
            rm -rf "dist/$PKG_DIR"
          done
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/SHA256SUMS
