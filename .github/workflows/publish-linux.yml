name: publish-linux

# Runs whenever release-please publishes a GitHub Release (i.e. its release
# PR gets merged to master), building and attaching Linux packages.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write # required for cosign keyless (OIDC) signing

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          dist/*.tar.gz dist/*.deb dist/*.rpm
          dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem
